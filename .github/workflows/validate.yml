name: Validate documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/runtime-probe
      - name: Validate JSON and Atom generation
        run: python3 scripts/validate.py
      - name: Ensure validation preserves tracked files
        run: git diff --exit-code
